server {
    listen 80;

    # Docker's embedded DNS. Short TTL so nginx notices containers coming and going.
    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        # Using a variable makes nginx resolve "app" at request time, not at startup.
        set $backend "http://app:8080";
        proxy_pass $backend;
        proxy_connect_timeout 500ms;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
