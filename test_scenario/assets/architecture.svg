<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <style>
    .box { fill: #f5f5f5; stroke: #222; stroke-width: 2; rx: 12; }
    .title { font: bold 22px sans-serif; fill: #111; }
    .label { font: 18px sans-serif; fill: #222; }
    .small { font: 15px sans-serif; fill: #444; }
    .arrow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" class="title">Terraform-managed application</text>

  <rect x="390" y="65" width="220" height="75" class="box"/>
  <text x="500" y="97" text-anchor="middle" class="label">Nginx</text>
  <text x="500" y="122" text-anchor="middle" class="small">Load balancer</text>

  <rect x="70" y="205" width="220" height="75" class="box"/>
  <text x="180" y="237" text-anchor="middle" class="label">Backend 0</text>
  <text x="180" y="262" text-anchor="middle" class="small">HTTP service :8080</text>

  <rect x="390" y="205" width="220" height="75" class="box"/>
  <text x="500" y="237" text-anchor="middle" class="label">Backend 1</text>
  <text x="500" y="262" text-anchor="middle" class="small">HTTP service :8080</text>

  <rect x="710" y="205" width="220" height="75" class="box"/>
  <text x="820" y="237" text-anchor="middle" class="label">Backend 2</text>
  <text x="820" y="262" text-anchor="middle" class="small">HTTP service :8080</text>

  <rect x="390" y="365" width="220" height="75" class="box"/>
  <text x="500" y="397" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="500" y="422" text-anchor="middle" class="small">Database</text>

  <path d="M455 140 L240 205" class="arrow"/>
  <path d="M500 140 L500 205" class="arrow"/>
  <path d="M545 140 L760 205" class="arrow"/>

  <path d="M180 280 L455 365" class="arrow"/>
  <path d="M500 280 L500 365" class="arrow"/>
  <path d="M820 280 L545 365" class="arrow"/>
</svg>